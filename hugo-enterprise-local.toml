# Local-dev variant of hugo-enterprise.toml. Used by
# `make server-enterprise`. baseURL is "/" instead of "/test" so
# `hugo server` mounts the home page at http://localhost:1313/ rather than
# the malformed http://localhost:1313//test/ that path-only baseURLs
# produce in dev mode. Production-shaped URL prefixes (folder, productPath,
# version urls) are stripped to match the bare-rooted layout.
baseURL = "/"
languageCode = "en-us"
title = "Docs framework test fixture (enterprise brand)"
linkTitle = "Test"
contentDir = "fixture/content/en/test"
publishDir = "public-enterprise-local"
enableInlineShortcodes = true


# The `book` output format, so the fixture actually BUILDS a book document.
#
# Without this the book layouts (docs/list.book.html, docs/single.book.html,
# _partials/docs/book-document.html) and assets/css/print-book.css are never
# executed by any test. Hugo parses every template, so a SYNTAX error in them
# still fails the build — but nothing semantic does. A deliberate
# `{{ .ThisMethodDoesNotExist }}` in book-document.html built green across the
# whole suite before this was added.
#
# It has to be in EVERY config that builds fixture/content/en/test, not just
# this one: `outputs` is a property of the PAGE, so a config missing the format
# fails the entire build with `OutputFormat with key "book" not found`. That is
# hugo-oss, hugo-enterprise, and both -local variants. The section-title and
# section-current builds are comma-joined overlays on this file and inherit it.
[outputFormats.book]
  mediaType = "text/html"
  baseName  = "book"
  isHTML    = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"
    disable = false

  # Fixture's consumer-side layout overrides — see hugo-oss.toml comment.
  # Mounted BEFORE the module's own layouts/ so a fixture file wins over a
  # module file at the same path, the way a consumer's project layouts do.
  # Only fixture/layouts/partials/docs/under-heading.html relies on it.
  [[module.mounts]]
    source = "fixture/layouts"
    target = "layouts"

  # Surface fixture/assets and fixture/static into Hugo's standard locations
  # for the self-test build. The fixture stays under fixture/ so it isn't
  # exposed to consumers that import this module via go.mod — they only see
  # top-level layouts/.
  [[module.mounts]]
    source = "layouts"
    target = "layouts"

  # Module's own CSS/JS overlay (custom.css drives version-dropdown,
  # copy-md-btn, and other docs-specific component styling that Hextra's
  # head partial auto-picks-up via resources.Get "css/custom.css").
  [[module.mounts]]
    source = "assets"
    target = "assets"

  [[module.mounts]]
    source = "fixture/assets"
    target = "assets"

  [[module.mounts]]
    source = "fixture/static"
    target = "static"

  # Content mounts (local dev only). The shared fixture tree plus the
  # tab-navigation demo tree (fixture/tabs-demo/v3, issue solo-io/docs#3164).
  # Mounting v3 here — instead of leaving it under contentDir — keeps it out
  # of the test build (hugo-enterprise.toml uses only contentDir), so the
  # pager / version specs never see a v3 sibling. Declaring an explicit
  # content mount overrides the contentDir default, so the base tree is
  # re-mounted too.
  [[module.mounts]]
    source = "fixture/content/en/test"
    target = "content"
  [[module.mounts]]
    source = "fixture/tabs-demo/v3"
    target = "content/v3"

[build]
  writeStats = true
  [[build.cachebusters]]
    source = "assets/watching/hugo_stats\\.json"
    target = "styles\\.css"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.(js|ts|jsx|tsx)"
    target = "js"
  [[build.cachebusters]]
    source = "assets/.*\\.(.*)$"
    target = "$1"

[params]

product = "Docs framework test fixture"
productPath = "/"
buildCondition = "test"
currentProduct = "test"
pathName = "/docs"
version = "latest"
defaultVersion = "v2"

# Retired-version fixtures, mirroring hugo-oss.toml / hugo-enterprise.toml so
# `make server-*` behaves like the built fixture. See the comment there.
retiredVersions = ["v0explicit"]
retiredVersionsFiles = ["fixture/static/_redirects"]
folder = ""
versionBanner = false
versionBannerText = ""
versionSpecificBanner = true

# This module's page-context partial dispatches on this flag. The fixture was
# authored against the docs convention (Site.Params.folder / currentProduct).
# Other consumers that follow the /docs/<section>/<version>/... URL shape can
# either omit this param (default is "url") or set it to "url" explicitly.
pageContextMode = "siteParams"

# Brand layer selector for head-end.html. Loads brand-enterprise.css.
[params.themeExtras]
  brand = "enterprise"

[params.footer]
  copyright = "Solo.io copyright 2026"
  displayPoweredBy = false

  # Enterprise puts the product lockup in the navbar (see params.navbar.logo),
  # so the Solo corporate mark moves to the footer.
  [params.footer.logo]
    path = "images/logos/solo-light.svg"
    dark = "images/logos/solo-dark.svg"

[params.docs]
  title = "Docs framework test fixture"
  toc = true

[params.navbar]
  displayTitle = false
  displayLogo = true
  width = "wide"

  # Product lockup in the navbar (enterprise). The Solo corporate mark now
  # lives in the footer (see params.footer.logo). With no sidebar.logo set, the
  # product logo is also the mobile navbar mark and the sidebar product-logo
  # band no longer renders — so the tab band sits directly above the left nav.
  [params.navbar.logo]
    path = "images/logos/logo-sef-test.svg"
    dark = "images/logos/logo-sef-test-dark.svg"
    width = 238
    height = 63

[params.page]
  width = "wide"

[params.theme]
  default = "system"
  displayToggle = false

[params.search]
  enable = true
  type = "flexsearch"

  [params.search.flexsearch]
    index = "content"

[params.editURL]
  enable = false

[[params.versions]]
  version = "v2"
  sections = ["demo", "alt", "nested"]
  dropdown = "v2 (current)"
  linkVersion = "v2"
  # POISON VALUE, deliberately. `url` on a same-product params.versions entry is
  # DEAD: every reader constructs the href instead, which is what preserves the
  # reader's current page across a version switch (CHANGELOG [0.2.2]). The real
  # configs dropped the field; this fixture keeps it, set to a URL that must
  # never appear in any built page, so that a reader which starts consulting it
  # again FAILS instead of silently working. Held correct values before, which is
  # exactly why nothing would have noticed.
  # Asserted by tests/related-docs.spec.ts.
  url = "https://must-not-render.invalid/dead-url-field/"
  product = "test"
  productName = "Docs framework test fixture"

[[params.versions]]
  version = "v1"
  sections = ["demo", "nested"]
  # Second ossVersion mapping, used only by the keepVersion collision probe in
  # conrefs/test/version-remap.md: it makes the token `v3` — which is also a
  # real version in this fixture — remap to `v1`. That is the production shape
  # that broke kgateway's github-branch.md (a keepVersion block whose enterprise
  # token collides with another entry's ossVersion). `v3` is used in no other
  # include-if/exclude-if in the fixture, so the mapping is inert everywhere
  # else. See tests/reuse-version-remap.spec.ts.
  ossVersion = "v3"
  dropdown = "v1"
  linkVersion = "v1"
  # POISON VALUE, deliberately. `url` on a same-product params.versions entry is
  # DEAD: every reader constructs the href instead, which is what preserves the
  # reader's current page across a version switch (CHANGELOG [0.2.2]). The real
  # configs dropped the field; this fixture keeps it, set to a URL that must
  # never appear in any built page, so that a reader which starts consulting it
  # again FAILS instead of silently working. Held correct values before, which is
  # exactly why nothing would have noticed.
  # Asserted by tests/related-docs.spec.ts.
  url = "https://must-not-render.invalid/dead-url-field/"
  product = "test"
  productName = "Docs framework test fixture"

[[params.versions]]
  version = "main"
  sections = ["alt"]
  dropdown = "main (dev)"
  linkVersion = "main"
  # POISON VALUE, deliberately. `url` on a same-product params.versions entry is
  # DEAD: every reader constructs the href instead, which is what preserves the
  # reader's current page across a version switch (CHANGELOG [0.2.2]). The real
  # configs dropped the field; this fixture keeps it, set to a URL that must
  # never appear in any built page, so that a reader which starts consulting it
  # again FAILS instead of silently working. Held correct values before, which is
  # exactly why nothing would have noticed.
  # Asserted by tests/related-docs.spec.ts.
  url = "https://must-not-render.invalid/dead-url-field/"
# The -local configs serve at baseURL "/" (the production ones use "/test"),
  # so the internal banner link must be root-relative WITHOUT the /test prefix or
  # it 404s in `make server-oss` — which reads as exactly the "banner link is
  # broken" report this banner styling exists to prevent.
  banner = "This version of the documentation is currently under development. See the [v2 docs](/v2/) or the [upstream project](https://github.com/solo-io/docs)."
  product = "test"
  productName = "Docs framework test fixture"

# v3 is the tab-navigation demo version (issue solo-io/docs#3164). It is also
# declared (and mounted) in hugo-oss.toml / hugo-enterprise.toml so the CI test
# build exercises the id-based tab band; kept here too so `make server-oss` /
# `server-enterprise` render it for local preview.
[[params.versions]]
  version = "v3"
  # SHARED WITH THE v2 ENTRY, deliberately: two enterprise trees built from one
  # upstream release. That is the one-to-many shape the remap in reuse.html /
  # rebase.html used to get wrong — it keyed its placeholder on the version
  # ENTRY, so the first entry claiming `v2oss` consumed the only token in the
  # gate and this one silently got nothing, leaving v3 to render content gated
  # out of the upstream release it is built from. agentgateway hit exactly this
  # with `latest` and `2026.9.x` both mapping to OSS 1.5.x.
  #
  # So the `include-if="v2oss"` row in conrefs/test/version-remap.md must now
  # render on v2 AND v3, which is what tests/reuse-version-remap.spec.ts
  # asserts. The `v3` TOKEN still maps to v1 through the v1 entry's own
  # ossVersion, so the keepVersion collision probe is unaffected.
  ossVersion = "v2oss"
  dropdown = "v3 (tabs demo)"
  linkVersion = "v3"
  # POISON VALUE, deliberately. `url` on a same-product params.versions entry is
  # DEAD: every reader constructs the href instead, which is what preserves the
  # reader's current page across a version switch (CHANGELOG [0.2.2]). The real
  # configs dropped the field; this fixture keeps it, set to a URL that must
  # never appear in any built page, so that a reader which starts consulting it
  # again FAILS instead of silently working. Held correct values before, which is
  # exactly why nothing would have noticed.
  # Asserted by tests/related-docs.spec.ts.
  url = "https://must-not-render.invalid/dead-url-field/"
  product = "test"
  productName = "Docs framework test fixture"

# ── Tab navigation (PROTOTYPE — issue solo-io/docs#3164) ──────────────────
# Declares the tab bar rendered by layouts/_partials/docs-tabs.html. The list
# is ordered; `default = true` marks the tab that's active on pages above every
# tab directory (e.g. the version-root landing).
#
# Directory model: each tab's `id` names a top-level content directory under the
# version root; every page in that directory is the tab, and the left nav is
# rooted INSIDE the directory, so the directory's own node never appears (this
# is what removes the "tab name shown twice" duplication). The tabs-demo v3 tree
# is partitioned this way — documentation/, api/, changelog/. A version with
# fewer than 2 tab directories renders no band (v1/v2/main here), which is the
# "without tabs" view.
[[params.docTabs]]
  name = "Documentation"
  id = "documentation"
  default = true

[[params.docTabs]]
  name = "API Reference"
  id = "api"

[[params.docTabs]]
  name = "Changelog"
  id = "changelog"
  # Drop the left nav on this tab's pages at the desktop-sidebar breakpoint and
  # up: changelog/ holds only its landing, so the desktop nav would be a
  # one-item tree next to a full-width article. Absent (or false) on the other
  # two tabs, which keep their nav — the default, so existing consumers are
  # unaffected. Mobile is never affected: below the breakpoint the panel IS the
  # slide-out drawer (tab chips, version chips, the other tabs' trees), so it
  # always renders. Exercises tests/docs-tabs.spec.ts + docs-tabs-sidebar.spec.ts.
  hideSidebar = true


# Hidden version. A whitespace-only `dropdown` is the "published but not
# advertised" signal: flexsearch.js leaves it out of `visibleVersions`, so it
# never surfaces under "Other versions" in search results.
#
# It is backed by real content (fixture/content/en/test/v8-link/), which matters
# for two reasons. It matches production — agentgateway's 2.2.x and 2.1.x are
# hidden this way and both have full content — and it is what exposed the navbar
# bug fixed in CHANGELOG [0.2.2]: the navbar used to EMIT a hidden entry (as an
# empty, still-clickable row) instead of skipping it, so a content-less hidden
# version put a broken link in every version dropdown on the site. Keeping real
# content here means a regression back to emitting shows up as a bad link rather
# than as a silently-different DOM.
#
# It replaces the old `searchonly` section's two probes. The other thing they
# tested — that the visible set is keyed on `linkVersion` rather than `version` —
# is now covered by the v4 / v4-link entry above, which has real content, so a
# second content-less probe for it was redundant.
#
# Asserted by tests/search-visible-versions.spec.ts.
[[params.versions]]
  version = "v8"
  dropdown = "   "
  linkVersion = "v8-link"
  product = "test"
  productName = "Docs framework test fixture"

# Section REGISTRY. A section exists because it is a key here; an empty table is
# the normal way to declare one, and it is what utils/section-segment.html uses
# to recognize a section segment in a URL. Under the tagged-versions model
# (CHANGELOG [0.2.2]) these tables no longer carry a `versions` list — a version
# entry names its sections instead, in the ONE site.Params.versions list above.
#
# Two sections, with deliberately overlapping membership, so the filter in
# utils/resolve-section-versions.html is exercised in both directions:
#
#   resolve("demo") -> v2, v1, v3, v4   (tagged demo, plus the untagged pair)
#   resolve("alt")  -> v2, main, v3, v4 (tagged alt,  plus the untagged pair)
#   resolve("")     -> every entry
#
# v2 belongs to both, v1 to demo only, main to alt only, and v3/v4 are untagged
# ("every section"). A one-sided fixture — everything tagged, or everything
# untagged — could not tell filtering from a no-op.
[params.sections.demo]
[params.sections.alt]
# The only section that NESTS its version trees, at /test/nested/<version>/.
# demo and alt deliberately do not, so the two shapes are covered side by side.
[params.sections.nested]
# ── Related products ──────────────────────────────────────────────────────────
# Other products whose versions share this product's version dropdown. This is
# the ONLY place a version URL is written out by hand, because these point at
# another site entirely (utils/resolve-related-docs.html explains why they were
# split out of params.versions).
#
# ORDER IS TOML ORDER. `position` picks the side of this product's own versions;
# "after" is the default, so only the rare "before" case says anything. Both
# sides are populated here on purpose: the ordering is the whole point of the
# design, and asserting it needs a group on each side plus TWO groups sharing a
# side (to prove same-side order is declaration order, not alphabetical).
#
# Deliberately covered here and nowhere else in the suite:
#   - a "before" group (only hugo-gateway.toml does this in production)
#   - two "after" groups, so same-side ordering is observable
#   - a version with a whitespace `label`, which must be SKIPPED, matching the
#     hidden-version rule for this product's own versions
#   - a group with no `versions`, which must warn and render no bare header
# This is the enterprise-brand local-dev fixture config.

[[params.relatedDocs]]
  productName = "Upstream fixture product"
  position = "before"
  [[params.relatedDocs.versions]]
    label = "u2 (upstream latest)"
    url = "https://example.invalid/upstream/u2/"
  [[params.relatedDocs.versions]]
    label = "u1"
    url = "https://example.invalid/upstream/u1/"

[[params.relatedDocs]]
  # No `position`, so this must land AFTER — the default is what production
  # relies on (kgateway and gloo-mesh-enterprise both omit it).
  productName = "Sibling fixture product"
  [[params.relatedDocs.versions]]
    label = "s3"
    url = "https://example.invalid/sibling/s3/"
  [[params.relatedDocs.versions]]
    # Whitespace label = hidden, exactly as a whitespace `dropdown` hides one of
    # this product's own versions. Must not render an empty clickable chip/row.
    label = "   "
    url = "https://example.invalid/sibling/s2/"

[[params.relatedDocs]]
  # Second "after" group. It is declared last and must RENDER last: same-side
  # order is declaration order. Named to sort BEFORE "Sibling" alphabetically,
  # so an accidental sort would be visible.
  productName = "Downstream fixture product"
  position = "after"
  [[params.relatedDocs.versions]]
    label = "d1"
    url = "https://example.invalid/downstream/d1/"

[[menu.main]]
  name = "Search"
  weight = 1
  [menu.main.params]
    type = "search"

[[menu.main]]
  name = "Theme"
  weight = 5
  [menu.main.params]
    type = "theme-toggle"
    label = false

[[menu.main]]
  name = "GitHub"
  weight = 3
  url = "https://github.com/solo-io"
  [menu.main.params]
    icon = "github"

[outputs]
  home = ["HTML", "RSS", "llms"]
  page = ["HTML", "markdown"]
  section = ["HTML", "RSS", "markdown"]

[markup]

[markup.tableOfContents]
  endLevel = 6
  startLevel = 1

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser]
  attribute = true

[markup.goldmark.extensions.extras.superscript]
  enable = true

[markup.highlight]
  noClasses = false

[sitemap]
  changeFreq = ''
  filename = 'sitemap.xml'
  priority = -1
