# Consumer-facing module config. When a consumer imports this module via
# go.mod, Hugo loads THIS file (not the brand-specific hugo-{oss,enterprise}.toml
# files used for the module's own standalone builds) and merges its mounts.
#
# Scope is intentionally narrow: only [[module.mounts]] declarations.
# No baseURL, no params, no theme settings — those belong in each consumer.

[module]

  # Re-export hextra to consumers transitively. When a consumer imports
  # this module via go.mod, Hugo reads THIS file and applies its imports
  # transitively. By declaring hextra here, consumers don't need to list
  # it separately in their own hugo configs — they get hextra at lower
  # precedence than docs-theme-extras automatically (Hugo prefers
  # files from this module's own layouts/ over the imported hextra
  # ones because docs-theme-extras is the directly-importing module).
  #
  # The hextra version is pinned in this module's go.mod. Consumers
  # bumping their docs-theme-extras pin pick up the matching hextra
  # version in lockstep.
  [[module.imports]]
    path = "github.com/imfing/hextra"
    disable = false

  # Layouts and CSS overlay (the "extras" the module is named for).
  [[module.mounts]]
    source = "layouts"
    target = "layouts"

  [[module.mounts]]
    source = "assets"
    target = "assets"

  # Theme-shipped data (site.Data.icons entries for the built-in [!SOLO] alert
  # type). Declared explicitly because this module overrides the default mounts
  # above; a consumer's own data/ still merges on top.
  [[module.mounts]]
    source = "data"
    target = "data"

  # UI strings the module's own templates pass to `T` (for example the
  # navigation landmark labels). Hugo merges translation tables across modules
  # key by key, so a consumer's i18n/<lang>.yaml still overrides any of these,
  # and Hextra's own strings are untouched.
  [[module.mounts]]
    source = "i18n"
    target = "i18n"

  # Fixture content/assets/static are deliberately NOT mounted at the
  # module level: a module-level mount at target="content" collides with
  # consumer contentDir scoping and would surface the test fixture in
  # every product build (wanted only in the consumer's test product).
  #
  # Consumers that want the fixture declare per-import mounts in their
  # own hugo config, e.g.:
  #
  #   [[module.imports]]
  #     path = "github.com/solo-io/docs-theme-extras"
  #     [[module.imports.mounts]]
  #       source = "fixture/content/en/test"
  #       target = "content/en/test"
  #     [[module.imports.mounts]]
  #       source = "fixture/assets/conrefs/test"
  #       target = "assets/conrefs/test"
  #     # ...
  #
  # That way the test product (contentDir = "content/en/test") reads the
  # module's fixture, and other products don't see /test/ at all.

# The `book` output format, for the PDF-export pipeline (see
# docs/configuration/pdf-export.md). Declared HERE, once, rather than in every
# consumer config — Hugo merges a module's top-level `outputFormats` into the
# importing project, the same way it merges the `[module]` block above.
#
# This corrects a long-standing claim in this module's own docs, which said the
# block could not live here and had to be repeated per consumer config. It cost
# solo-io/docs 25 identical copies (three configs for each of eight products,
# plus the all-products preview), each one a place to forget it — and forgetting
# it does not fail the PDF, it fails the ENTIRE build, because the `outputs`
# front matter that selects the format is a property of the page and therefore
# applies to every config that builds that content:
#
#   ERROR failed to resolve output formats [html book]:
#         OutputFormat with key "book" not found
#
# Verified by removing the block from one consumer config and building: the site
# builds and book.html renders. Control: removing it from HERE as well
# reproduces the error above.
#
# Inert for a consumer that publishes no PDF. Defining an output format does not
# make anything render it — a page opts in through `outputs` front matter, and no
# `[outputs]` default includes `book`. A consumer that declares its own identical
# block is unaffected; project config wins over module config.
#
# NOT redundant with the copies in this repo's own hugo-{oss,enterprise}*.toml:
# those builds pass `--config`, which replaces the default config lookup, so this
# file is not read for them. The module path and the project path are separate.
[outputFormats.book]
  mediaType = "text/html"
  baseName = "book"
  isHTML = true
