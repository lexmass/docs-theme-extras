name: Deploy docs site

# Build docs/content/ with hugo-docs.toml and publish it to GitHub Pages at
# https://solo-io.github.io/docs-theme-extras/.
#
# SEPARATE FROM test.yml ON PURPOSE. The site is built by the module it
# documents, so a theme regression can break the docs that explain the theme.
# Keeping this out of the required `test-all` context means that failure never
# blocks a merge or a release; the cost is that a broken build leaves the last
# good deploy up silently, so check the Actions tab if the site looks stale.
#
# BUILDS on pull requests, DEPLOYS only on main.
#
# Pages is a single live environment, so deploying from a PR is not an option.
# Building from one very much is, and it is the more valuable half: because the
# site is built by the module it documents, a layouts/ change can break the docs
# that explain the theme, and the whole point is to learn that before merging
# rather than from a red run on main afterwards.
#
# The build job is NOT in the `Tests success` ruleset (that requires `test-all`
# only), so a broken docs build shows as a failed check without blocking the
# merge. That preserves the original intent — a Pages failure never holds up a
# release — while still putting the failure in front of a reviewer.
#
# The PR run also uploads the built site as an artifact, so a reviewer can
# download and open it. `make server-docs` is still the faster local loop.


# The two path lists below are duplicated on purpose. A YAML anchor would be the
# obvious way to share them and it parses fine locally, but GitHub Actions does
# not officially support anchors in workflow files — so the failure would be a
# workflow that does not parse, or one whose pull_request trigger silently has
# no path filter and fires on every PR. Keep the two lists in sync by hand.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'layouts/**'
      - 'assets/**'
      - 'data/**'
      - 'hugo-docs.toml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'layouts/**'
      - 'assets/**'
      - 'data/**'
      - 'hugo-docs.toml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed on the ref so a PR build never queues behind a main deployment. Every
# push to main shares one group, which is what serializes deployments.
#
# cancel-in-progress only on PRs, matching test.yml: a started deployment must
# finish rather than leaving the environment half-updated, so a superseding
# merge queues behind it, while a superseding push to a PR branch cancels its
# own older run instead of stacking a second one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.160.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Deploy path only. Nothing in the build consumes its outputs — the
      # baseURL is hardcoded in hugo-docs.toml, deliberately, so the build is
      # identical whoever runs it. Skipping it on PRs also removes a failure
      # mode: it needs `pages: write`, which a pull_request event from a fork
      # does not get.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'

      # Pinned at v3 for the same reason test.yml is: the maintainer has not
      # published a Node.js 24-compatible release, and GitHub starts forcing
      # Node 24 in June 2026. Whatever test.yml migrates to, migrate this with
      # it — two workflows drifting onto different Hugo installers is how the
      # site starts building against a version nothing else tests.
      - name: Set up Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Set up Go (Hugo modules use go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21'

      - name: Cache Hugo modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hugo_cache
          key: ${{ runner.os }}-hugo-${{ hashFiles('go.sum', 'go.mod') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      # HUGO=hugo overrides the Makefile's hugo160 default, which is the local
      # convention; peaceiris/actions-hugo installs the binary as `hugo`.
      - name: Build the docs site
        run: HUGO=hugo make build-docs

      # A Hugo build can succeed while emitting warnings that matter here —
      # notably the module's own warnMissingDescription, which fires per page
      # and would otherwise scroll past unread. Surface the log every run, not
      # just on failure.
      - name: Show build log
        if: always()
        run: cat .build-docs.log || true

      # include-hidden-files is NOT optional here, and its default is a silent
      # no-op. The action tars the directory with `--exclude=.[^/]*` unless this
      # is true, so docs/static/.nojekyll would be stripped on the way into the
      # artifact — the file would sit in the repo looking like protection while
      # never reaching Pages, and nothing would report it.
      #
      # Whether .nojekyll is needed at all is a fair question: Jekyll only runs
      # under build_type "legacy", and this repo uses "workflow". It stays as
      # cheap insurance against the Pages source being switched back by hand.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public-docs
          include-hidden-files: true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hugo-build-log-docs
          path: .build-docs.log
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: build
    # main only. The github-pages environment's deployment branch policy also
    # allows main alone, so a PR reaching here would fail on the policy rather
    # than deploy something unreviewed — but failing a job to enforce that is a
    # confusing way to express it. Say it here instead.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
