# Brand-OSS variant of the bundled-fixture build. Used by
# `make build-oss` / `make self-test-oss`. Same content/layouts as
# hugo.toml; flips themeExtras.brand to "oss" so head-end.html links
# brand-oss.css. Build output goes under public-oss/ to avoid clobbering
# the bare and enterprise builds, with the harness pointing there via
# fixture/.docs-test-oss.toml.
baseURL = "/test"
languageCode = "en-us"
title = "Docs framework test fixture (OSS brand)"
linkTitle = "Test"
contentDir = "fixture/content/en/test"
publishDir = "public-oss/test"
enableInlineShortcodes = true


# The `book` output format, so the fixture actually BUILDS a book document.
#
# Without this the book layouts (docs/list.book.html, docs/single.book.html,
# _partials/docs/book-document.html) and assets/css/print-book.css are never
# executed by any test. Hugo parses every template, so a SYNTAX error in them
# still fails the build — but nothing semantic does. A deliberate
# `{{ .ThisMethodDoesNotExist }}` in book-document.html built green across the
# whole suite before this was added.
#
# It has to be in EVERY config that builds fixture/content/en/test, not just
# this one: `outputs` is a property of the PAGE, so a config missing the format
# fails the entire build with `OutputFormat with key "book" not found`. That is
# hugo-oss, hugo-enterprise, and both -local variants. The section-title and
# section-current builds are comma-joined overlays on this file and inherit it.
[outputFormats.book]
  mediaType = "text/html"
  baseName  = "book"
  isHTML    = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"
    disable = false

  # Content mounts. The base fixture tree, plus the tab-navigation demo tree
  # (fixture/tabs-demo/v3, issue solo-io/docs#3164) so the directory/id tab
  # model is exercised in CI: v3 partitions its docs into per-tab directories
  # (documentation/, api/, changelog/) and renders the ENABLED band, while
  # main/v1/v2 have no tab dirs and render the DISABLED (no-band) state.
  # Declaring an explicit content mount overrides the contentDir default, so
  # the base tree is re-mounted here too.
  [[module.mounts]]
    source = "fixture/content/en/test"
    target = "content"
  [[module.mounts]]
    source = "fixture/tabs-demo/v3"
    target = "content/v3"

  # Fixture's consumer-side layout overrides (partials/custom/head-end.html,
  # partials/custom/footer.html). They demonstrate the module-bootstrap
  # contract every real consumer must implement and emit MARKER_CUSTOM_*
  # sentinels that presence.spec.ts checks for. NOT exposed to consumers
  # via hugo.toml — only the self-test fixture sees these.
  # Mounted BEFORE the module's own layouts/ so a fixture file wins over a
  # module file at the same path, the way a consumer's project layouts do.
  # Only fixture/layouts/partials/docs/under-heading.html relies on it.
  [[module.mounts]]
    source = "fixture/layouts"
    target = "layouts"

  # Surface fixture/assets and fixture/static into Hugo's standard locations
  # for the self-test build. The fixture stays under fixture/ so it isn't
  # exposed to consumers that import this module via go.mod — they only see
  # top-level layouts/.
  [[module.mounts]]
    source = "layouts"
    target = "layouts"

  # Module's own CSS/JS overlay (custom.css drives version-dropdown,
  # copy-md-btn, and other docs-specific component styling that Hextra's
  # head partial auto-picks-up via resources.Get "css/custom.css").
  [[module.mounts]]
    source = "assets"
    target = "assets"

  [[module.mounts]]
    source = "fixture/assets"
    target = "assets"

  [[module.mounts]]
    source = "fixture/static"
    target = "static"

  # Theme-shipped icons (solo) so the standalone fixture build has the same
  # site.Data.icons entries a consumer gets, letting callout-icon.spec and
  # custom-alert.spec exercise the built-in [!SOLO] type.
  [[module.mounts]]
    source = "data"
    target = "data"

  # Fixture-only glossary terms, unioned onto the target above. Kept out of the
  # shipped data/ for the reason fixture/data/glossary.yaml explains: a module
  # ships its whole data tree, so a test glossary at the repo root would reach
  # every consumer.
  [[module.mounts]]
    source = "fixture/data"
    target = "data"

[build]
  writeStats = true
  [[build.cachebusters]]
    source = "assets/watching/hugo_stats\\.json"
    target = "styles\\.css"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.(js|ts|jsx|tsx)"
    target = "js"
  [[build.cachebusters]]
    source = "assets/.*\\.(.*)$"
    target = "$1"

[params]

product = "Docs framework test fixture"
productPath = "/test"
buildCondition = "test"
currentProduct = "test"
pathName = "/test/docs"
version = "latest"
defaultVersion = "v2"

# Retired versions named explicitly, source 1 of utils/retired-versions.html.
# `v0explicit` has no [[params.versions]] entry and no redirect rule: it is here
# to prove the escape hatch works on its own, for a consumer whose redirects
# live somewhere the theme cannot read (an edge worker, an ingress rule).
# Sources 2 and 3 are exercised by fixture/static/_redirects.
retiredVersions = ["v0explicit"]

# Point the retired-version reader at the fixture's REAL on-disk path.
# utils/retired-versions.html reads redirect files relative to the project root
# and does not traverse mounts, so the mounted `static/_redirects` is invisible
# to it. The fixture file cannot live at this repo's top-level static/ — that
# directory IS mounted into consumers, and shipping a `_redirects` would rewrite
# the hosting behavior of every Cloudflare consumer that imports this module.
# No real consumer sets this; they keep the file where the defaults look.
retiredVersionsFiles = ["fixture/static/_redirects"]

folder = "test"
versionBanner = false
versionBannerText = ""
versionSpecificBanner = true

# See hugo-enterprise.toml for why the fixture sets this and no real consumer
# does. Needed on BOTH brands: the book spec runs against each, and the OSS
# fixture is the half that proves a consumer with no [params.pdfDownload] table
# still renders a book and simply omits the download menu item.
buildBook = true

# This module's page-context partial dispatches on this flag. The fixture was
# authored against the docs convention (Site.Params.folder / currentProduct).
# Other consumers that follow the /docs/<section>/<version>/... URL shape can
# either omit this param (default is "url") or set it to "url" explicitly.
pageContextMode = "siteParams"

# Brand layer selector for head-end.html. Loads brand-oss.css.
[params.themeExtras]
  brand = "oss"
  # No custom alertTypes here: solo is built into the theme
  # (components/github-style-alert.html + data/icons.yaml), so custom-alert.spec
  # exercises it with zero consumer config.

[params.footer]
  copyright = "Solo.io copyright 2026"
  displayPoweredBy = false

# Enables the "Was this page helpful?" widget so page-feedback.spec.ts can
# assert the module's docs templates render it. Consumers opt in the same way.
[params.feedback]
  enable = true
  issueRepo = "solo-io/docs-theme-extras"

[params.docs]
  title = "Docs framework test fixture"
  toc = true

[params.navbar]
  displayTitle = false
  displayLogo = true
  width = "wide"

  # OSS navbar shows the product logo, not Solo's company mark. SVG aspect
  # ratio is ~3.79:1 (viewBox 2708×714), so width=152 / height=40 preserves
  # proportions without stretching.
  [params.navbar.logo]
    path = "images/logos/logo-oss-test.svg"
    dark = "images/logos/logo-oss-test-dark.svg"
    width = 152
    height = 40

# OSS leaves the sidebar product logo unset on purpose — the navbar already
# displays the product logo, so the sidebar slot would be a redundant
# duplicate. Hextra's sidebar partial skips the logo block entirely when
# Site.Params.sidebar.logo is unset.

[params.page]
  width = "wide"

[params.theme]
  default = "system"
  displayToggle = false

[params.search]
  enable = true
  type = "flexsearch"

  [params.search.flexsearch]
    index = "content"

[params.editURL]
  enable = false

# Tab navigation (issue solo-io/docs#3164), directory model. Each tab's `id` is
# a top-level content directory under the version root; the left nav is rooted
# INSIDE that directory (see layouts/partials/sidebar.html), so the directory's
# own node never appears. The v3 (tabs-demo) tree partitions its docs into
# documentation/, api/, and changelog/, giving it >=2 tab directories so the
# band renders — the ENABLED state docs-tabs.spec.ts asserts. main/v1/v2 have
# none of these directories, so they render no band — the DISABLED state, in
# the same build.
[[params.docTabs]]
  name = "Documentation"
  id = "documentation"
  default = true

[[params.docTabs]]
  name = "API Reference"
  id = "api"

[[params.docTabs]]
  name = "Changelog"
  id = "changelog"
  # Drop the left nav on this tab's pages at the desktop-sidebar breakpoint and
  # up: changelog/ holds only its landing, so the desktop nav would be a
  # one-item tree next to a full-width article. Absent (or false) on the other
  # two tabs, which keep their nav — the default, so existing consumers are
  # unaffected. Mobile is never affected: below the breakpoint the panel IS the
  # slide-out drawer (tab chips, version chips, the other tabs' trees), so it
  # always renders. Exercises tests/docs-tabs.spec.ts + docs-tabs-sidebar.spec.ts.
  hideSidebar = true

[[params.versions]]
  version = "v2"
  sections = ["demo", "alt", "nested"]
  # ossVersion drives reuse.html / rebase.html's OSS→enterprise version remap:
  # content authored with include-if="v2oss" is remapped to this entry's
  # `version` (v2). Exercised by content/en/test/{v2,v1}/version-remap.md +
  # tests/reuse-version-remap.spec.ts. No existing content gates on "v2oss",
  # so the remap is a no-op everywhere else.
  ossVersion = "v2oss"
  dropdown = "v2 (current)"
  linkVersion = "v2"
  # POISON VALUE, deliberately. `url` on a same-product params.versions entry is
  # DEAD: every reader constructs the href instead, which is what preserves the
  # reader's current page across a version switch (CHANGELOG [0.2.2]). The real
  # configs dropped the field; this fixture keeps it, set to a URL that must
  # never appear in any built page, so that a reader which starts consulting it
  # again FAILS instead of silently working. Held correct values before, which is
  # exactly why nothing would have noticed.
  # Asserted by tests/related-docs.spec.ts.
  url = "https://must-not-render.invalid/dead-url-field/"
  product = "test"
  productName = "Docs framework test fixture"
  # Marks v2 as the CURRENT version, which is what switches on
  # utils/version-noindex.html: an older version's copy of a page that still
  # exists in v2 is a near-duplicate and gets `noindex, follow`, while a page
  # that exists ONLY in an older version stays indexable. `latest` is read by
  # that partial alone. Needed because this fixture's current version is a bare
  # name (v2) rather than being served at /latest/, so the partial's other
  # detection signal (linkVersion == "latest") never fires here and it would
  # otherwise stay inert — which is exactly why it shipped untested.
  # Asserted by tests/version-noindex.spec.ts.
  latest = true

[[params.versions]]
  version = "v1"
  # The PRINT label for this tree's book, read only by
  # utils/book-version.html. Set here and nowhere else in this fixture, so the
  # two books test the two branches of that resolution: v2 has no
  # releaseVersion and falls back to `.version` ("v2"), while v1 proves an
  # explicit releaseVersion WINS over its `.version` ("v1").
  #
  # It stands in for agentregistry/kagent/agentgateway in solo-io/docs, whose
  # current tree sets `version = "latest"` because that field also names
  # assemble-assets.py's asset directories and is what reuse.html matches URL
  # segments against — so the real release number cannot live there. The value
  # here is deliberately a string that appears nowhere else, and in particular
  # is NOT "v1", so an assertion cannot pass by accident.
  releaseVersion = "1.9.3"
  sections = ["demo", "nested"]
  # Second ossVersion mapping, used only by the keepVersion collision probe in
  # conrefs/test/version-remap.md: it makes the token `v3` — which is also a
  # real version in this fixture — remap to `v1`. That is the production shape
  # that broke kgateway's github-branch.md (a keepVersion block whose enterprise
  # token collides with another entry's ossVersion). `v3` is used in no other
  # include-if/exclude-if in the fixture, so the mapping is inert everywhere
  # else. See tests/reuse-version-remap.spec.ts.
  ossVersion = "v3"
  dropdown = "v1"
  linkVersion = "v1"
  # POISON VALUE, deliberately. `url` on a same-product params.versions entry is
  # DEAD: every reader constructs the href instead, which is what preserves the
  # reader's current page across a version switch (CHANGELOG [0.2.2]). The real
  # configs dropped the field; this fixture keeps it, set to a URL that must
  # never appear in any built page, so that a reader which starts consulting it
  # again FAILS instead of silently working. Held correct values before, which is
  # exactly why nothing would have noticed.
  # Asserted by tests/related-docs.spec.ts.
  url = "https://must-not-render.invalid/dead-url-field/"
  product = "test"
  productName = "Docs framework test fixture"
  # Entry-level banner, plus a SECTION-SCOPED override below. v1 is tagged
  # sections = ["demo", "nested"], and `nested` is the only fixture section that
  # nests its version trees (/test/nested/v1/…), so it is the only one whose
  # pages carry a section segment for the override to key off.
  #
  # Together these cover all three paths in version-banner.html:
  #   /test/nested/v1/…  -> the override text  (section declares one)
  #   /test/v1/…         -> this entry text    (no section segment in the URL)
  #   /test/nested/v2/…  -> no banner at all   (v2 sets neither)
  # Asserted by tests/version-section-banner.spec.ts.
  banner = "MARKER_BANNER_ENTRY. This is the v1 entry-level banner."

  [params.versions.sectionBanners.nested]
    banner = "MARKER_BANNER_SECTION. This is the nested-section override banner."

[[params.versions]]
  version = "main"
  sections = ["alt"]
  dropdown = "main (dev)"
  linkVersion = "main"
  # POISON VALUE, deliberately. `url` on a same-product params.versions entry is
  # DEAD: every reader constructs the href instead, which is what preserves the
  # reader's current page across a version switch (CHANGELOG [0.2.2]). The real
  # configs dropped the field; this fixture keeps it, set to a URL that must
  # never appear in any built page, so that a reader which starts consulting it
  # again FAILS instead of silently working. Held correct values before, which is
  # exactly why nothing would have noticed.
  # Asserted by tests/related-docs.spec.ts.
  url = "https://must-not-render.invalid/dead-url-field/"
  banner = "This version of the documentation is currently under development. See the [v2 docs](/test/v2/) or the [upstream project](https://github.com/solo-io/docs)."
  product = "test"
  productName = "Docs framework test fixture"

# v3 (tab-navigation demo, issue solo-io/docs#3164). Directory-partitioned into
# documentation/, api/, changelog/ so it exercises the ENABLED id-based tab
# band; the other versions have no tab dirs and stay in the DISABLED state.
[[params.versions]]
  version = "v3"
  # SHARED WITH THE v2 ENTRY, deliberately: two enterprise trees built from one
  # upstream release. That is the one-to-many shape the remap in reuse.html /
  # rebase.html used to get wrong — it keyed its placeholder on the version
  # ENTRY, so the first entry claiming `v2oss` consumed the only token in the
  # gate and this one silently got nothing, leaving v3 to render content gated
  # out of the upstream release it is built from. agentgateway hit exactly this
  # with `latest` and `2026.9.x` both mapping to OSS 1.5.x.
  #
  # So the `include-if="v2oss"` row in conrefs/test/version-remap.md must now
  # render on v2 AND v3, which is what tests/reuse-version-remap.spec.ts
  # asserts. The `v3` TOKEN still maps to v1 through the v1 entry's own
  # ossVersion, so the keepVersion collision probe is unaffected.
  ossVersion = "v2oss"
  dropdown = "v3 (tabs demo)"
  linkVersion = "v3"
  # POISON VALUE, deliberately. `url` on a same-product params.versions entry is
  # DEAD: every reader constructs the href instead, which is what preserves the
  # reader's current page across a version switch (CHANGELOG [0.2.2]). The real
  # configs dropped the field; this fixture keeps it, set to a URL that must
  # never appear in any built page, so that a reader which starts consulting it
  # again FAILS instead of silently working. Held correct values before, which is
  # exactly why nothing would have noticed.
  # Asserted by tests/related-docs.spec.ts.
  url = "https://must-not-render.invalid/dead-url-field/"
  product = "test"
  productName = "Docs framework test fixture"

# v4 is the LINKVERSION-DIVERGENCE probe: it is the only entry whose
# `version` differs from its `linkVersion`, so it is the only way this fixture
# can tell "matched on the canonical version" apart from "matched on the URL
# slug". Every other entry sets the two equal (v2/v2, v1/v1, main/main, v3/v3),
# which made that whole class of bug invisible here while PRODUCTION diverges
# routinely: gloo-mesh-enterprise and gloo-mesh-gateway both map 2.14.x->main
# and 2.13.x->latest, kgateway-oss maps 2.5.x->main and 2.4.x->latest, and
# agentgateway-oss maps 1.5.x->main and 1.4.x->latest.
#
# Why it matters: content authors write `include-if="2.13.x"` (the canonical
# release), but the page is served at /latest/. version.html passes BOTH
# `.version` and `.linkVersion` as gate tokens for exactly that reason, and
# reuse.html / rebase.html resolve versioned assets under the CANONICAL
# `assets/<product>/<version>/` path (that is how assemble-assets.py names its
# mount targets), not the URL slug. Nothing here could catch a regression in
# either behavior before this entry existed.
#
# The name is deliberate too: "v4" is a strict SUBSTRING of "v4-link".
# version.html matches with `in $condition .linkVersion` (a substring test, not
# an equality test), so this pair is also the probe for a slug collision.
#
# Content lives at fixture/content/en/test/v4-link/. Asserted by
# tests/version-linkversion.spec.ts.
[[params.versions]]
  version = "v4"
  dropdown = "v4 (linkVersion probe)"
  linkVersion = "v4-link"
  # POISON VALUE, deliberately. `url` on a same-product params.versions entry is
  # DEAD: every reader constructs the href instead, which is what preserves the
  # reader's current page across a version switch (CHANGELOG [0.2.2]). The real
  # configs dropped the field; this fixture keeps it, set to a URL that must
  # never appear in any built page, so that a reader which starts consulting it
  # again FAILS instead of silently working. Held correct values before, which is
  # exactly why nothing would have noticed.
  # Asserted by tests/related-docs.spec.ts.
  url = "https://must-not-render.invalid/dead-url-field/"
  product = "test"
  productName = "Docs framework test fixture"




# Hidden version. A whitespace-only `dropdown` is the "published but not
# advertised" signal: flexsearch.js leaves it out of `visibleVersions`, so it
# never surfaces under "Other versions" in search results.
#
# It is backed by real content (fixture/content/en/test/v8-link/), which matters
# for two reasons. It matches production — agentgateway's 2.2.x and 2.1.x are
# hidden this way and both have full content — and it is what exposed the navbar
# bug fixed in CHANGELOG [0.2.2]: the navbar used to EMIT a hidden entry (as an
# empty, still-clickable row) instead of skipping it, so a content-less hidden
# version put a broken link in every version dropdown on the site. Keeping real
# content here means a regression back to emitting shows up as a bad link rather
# than as a silently-different DOM.
#
# It replaces the old `searchonly` section's two probes. The other thing they
# tested — that the visible set is keyed on `linkVersion` rather than `version` —
# is now covered by the v4 / v4-link entry above, which has real content, so a
# second content-less probe for it was redundant.
#
# Asserted by tests/search-visible-versions.spec.ts.
[[params.versions]]
  version = "v8"
  dropdown = "   "
  linkVersion = "v8-link"
  product = "test"
  productName = "Docs framework test fixture"

# Section REGISTRY. A section exists because it is a key here; an empty table is
# the normal way to declare one, and it is what utils/section-segment.html uses
# to recognize a section segment in a URL. Under the tagged-versions model
# (CHANGELOG [0.2.2]) these tables no longer carry a `versions` list — a version
# entry names its sections instead, in the ONE site.Params.versions list above.
#
# Two sections, with deliberately overlapping membership, so the filter in
# utils/resolve-section-versions.html is exercised in both directions:
#
#   resolve("demo") -> v2, v1, v3, v4   (tagged demo, plus the untagged pair)
#   resolve("alt")  -> v2, main, v3, v4 (tagged alt,  plus the untagged pair)
#   resolve("")     -> every entry
#
# v2 belongs to both, v1 to demo only, main to alt only, and v3/v4 are untagged
# ("every section"). A one-sided fixture — everything tagged, or everything
# untagged — could not tell filtering from a no-op.
[params.sections.demo]
[params.sections.alt]
# The only section that NESTS its version trees, at /test/nested/<version>/.
# demo and alt deliberately do not, so the two shapes are covered side by side.
[params.sections.nested]
# ── Related products ──────────────────────────────────────────────────────────
# Other products whose versions share this product's version dropdown. This is
# the ONLY place a version URL is written out by hand, because these point at
# another site entirely (utils/resolve-related-docs.html explains why they were
# split out of params.versions).
#
# ORDER IS TOML ORDER. `position` picks the side of this product's own versions;
# "after" is the default, so only the rare "before" case says anything. Both
# sides are populated here on purpose: the ordering is the whole point of the
# design, and asserting it needs a group on each side plus TWO groups sharing a
# side (to prove same-side order is declaration order, not alphabetical).
#
# Deliberately covered here and nowhere else in the suite:
#   - a "before" group (only hugo-gateway.toml does this in production)
#   - two "after" groups, so same-side ordering is observable
#   - a version with a whitespace `label`, which must be SKIPPED, matching the
#     hidden-version rule for this product's own versions
#   - a group with no `versions`, which must warn and render no bare header
# This is the OSS-brand fixture config.

[[params.relatedDocs]]
  productName = "Upstream fixture product"
  position = "before"
  [[params.relatedDocs.versions]]
    label = "u2 (upstream latest)"
    url = "https://example.invalid/upstream/u2/"
  [[params.relatedDocs.versions]]
    label = "u1"
    url = "https://example.invalid/upstream/u1/"

[[params.relatedDocs]]
  # No `position`, so this must land AFTER — the default is what production
  # relies on (kgateway and gloo-mesh-enterprise both omit it).
  productName = "Sibling fixture product"
  [[params.relatedDocs.versions]]
    label = "s3"
    url = "https://example.invalid/sibling/s3/"
  [[params.relatedDocs.versions]]
    # Whitespace label = hidden, exactly as a whitespace `dropdown` hides one of
    # this product's own versions. SILENT — a deliberate hide, not an error.
    label = "   "
    url = "https://example.invalid/sibling/s2/"
  [[params.relatedDocs.versions]]
    # No `label` KEY at all. Unlike the whitespace case this is a config error,
    # so it warns as well as being skipped. Present in this config only, so the
    # other three fixture configs stay warning-clean.
    url = "https://example.invalid/sibling/s1/"

[[params.relatedDocs]]
  # Empty group: no [[params.relatedDocs.versions]]. Must emit a warnidf and
  # render NOTHING — not a bare header with no links under it. Present in this
  # config only, so the other three fixture configs stay warning-clean.
  productName = "Empty fixture product"

[[params.relatedDocs]]
  # Second "after" group. It is declared last and must RENDER last: same-side
  # order is declaration order. Named to sort BEFORE "Sibling" alphabetically,
  # so an accidental sort would be visible.
  productName = "Downstream fixture product"
  position = "after"
  [[params.relatedDocs.versions]]
    label = "d1"
    url = "https://example.invalid/downstream/d1/"

[[menu.main]]
  name = "Search"
  weight = 1
  [menu.main.params]
    type = "search"

[[menu.main]]
  name = "Theme"
  weight = 5
  [menu.main.params]
    type = "theme-toggle"
    label = false

[[menu.main]]
  name = "GitHub"
  weight = 3
  url = "https://github.com/solo-io"
  [menu.main.params]
    icon = "github"

[outputs]
  home = ["HTML", "RSS", "llms"]
  page = ["HTML", "markdown"]
  section = ["HTML", "RSS", "markdown"]

[markup]

[markup.tableOfContents]
  endLevel = 6
  startLevel = 1

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser]
  attribute = true

[markup.goldmark.extensions.extras.superscript]
  enable = true

[markup.highlight]
  noClasses = false

[sitemap]
  changeFreq = ''
  filename = 'sitemap.xml'
  priority = -1
